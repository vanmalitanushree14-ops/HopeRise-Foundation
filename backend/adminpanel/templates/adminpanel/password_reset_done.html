<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Email Sent - HopeRise Foundation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f4fb;
            font-family: Arial, sans-serif;
        }

        .card-box {
            width: 440px;
            max-width: 92%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h2 {
            color: #29233a;
            font-weight: 700;
        }

        p {
            color: #777189;
            line-height: 1.6;
            font-size: 14px;
        }

        .btn-login {
            display: inline-block;
            background: #7b2cbf;
            color: white;
            text-decoration: none;
            padding: 11px 25px;
            border-radius: 9px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card-box">

    <div class="icon">📧</div>

    <h2>Check Your Email</h2>

    <p>
        If an account exists with the email address you entered,
        a password reset link has been sent.
    </p>

    <p>
        For development, check your Django terminal for the
        reset link.
    </p>

    <a href="{% url 'login' %}" class="btn-login">
        Back to Login
    </a>

</div>

</body>
</html>
