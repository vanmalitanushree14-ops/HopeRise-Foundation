<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - HopeRise Foundation</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f4fb;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #7b2cbf;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 24px;
        }

        h2 {
            color: #29233a;
            font-weight: 700;
        }

        .subtitle {
            color: #777189;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-reset {
            width: 100%;
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-reset:hover {
            background: #6823a4;
            color: white;
        }

        .back-link {
            color: #7b2cbf;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="logo">
        ❤️
    </div>

    <h2 class="text-center mb-2">
        Forgot Password?
    </h2>

    <p class="subtitle text-center mb-4">
        Enter your registered email address and we will send you
        instructions to reset your password.
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
                autofocus
            >
        </div>

        <button type="submit" class="btn-reset">
            Send Reset Link
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>
